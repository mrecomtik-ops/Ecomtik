name: Ecomtik Live-Action Promo Video

on:
  pull_request:
    paths:
      - "video-production/**"
      - ".github/workflows/ecomtik-live-action-promo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render actual filmed business footage MP4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Verify Ecomtik logo and ffmpeg
        run: |
          test -f public/images/ecomtik.png
          ffmpeg -hide_banner -version | head -1
      - name: Build video from licensed stock footage
        run: python video-production/render_live_footage.py
      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ecomtik-live-action-video
          path: |
            video-production/output/Ecomtik_Amazon_Management_Live_Footage.mp4
            video-production/output/footage-sources.txt
          retention-days: 30
